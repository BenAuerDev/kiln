<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln – insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8A33}a:hover{color:#FFB36B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0F; color: #F5F5F4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <a href="Main.dc.html" aria-label="Back to control" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2A2E; background: #18181B; color: #F5F5F4; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Insights</span>
    <span style="width: 44px"></span>
  </div>

  <div style="padding: 12px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="padding: 16px; border-radius: 20px; background: #18181B; border: 1px solid #2A2A2E; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #A1A1A6">Sessions this week</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 36px; line-height: 1">13</span>
    </div>
    <div style="padding: 16px; border-radius: 20px; background: #18181B; border: 1px solid #2A2A2E; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #A1A1A6">Most used</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 36px; line-height: 1; color: #FF8A33">185°</span>
    </div>
  </div>

  <div style="margin: 12px 20px 0; padding: 16px; border-radius: 20px; background: #18181B; border: 1px solid #2A2A2E; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 13px; color: #A1A1A6">Sessions per day</span>
    <div role="img" aria-label="Sessions per day this week: Mon 2, Tue 1, Wed 3, Thu 0, Fri 2, Sat 4, Sun 1" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; height: 120px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; justify-content: flex-end; height: 120px">
          <div style="width: 100%; height: {{b.h}}px; border-radius: 6px; background: {{b.color}}"></div>
          <span style="font-size: 12px; color: #A1A1A6">{{b.day}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 12px 20px 0; padding: 16px; border-radius: 20px; background: #18181B; border: 1px solid #2A2A2E; display: flex; align-items: center; gap: 14px">
    <div style="width: 44px; height: 44px; border-radius: 14px; background: #26262A; display: flex; align-items: center; justify-content: center; color: #FF8A33">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l6-6M14 4l6 6-8 8-6-6z"></path><path d="M11 7l6 6"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
      <span style="font-size: 15px; font-weight: 600">Cleaning due soon</span>
      <span style="font-size: 13px; color: #A1A1A6">Volcano Hybrid · 8.5 of 10 heating hours used</span>
    </div>
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A2A2E; background: #26262A; color: #F5F5F4; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Done</button>
  </div>

  <div style="margin: 12px 20px 0; padding: 16px; border-radius: 20px; background: #18181B; border: 1px solid #2A2A2E; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; color: #A1A1A6">Average heat-up</span>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 600">Volcano Hybrid</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums">48 s</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 600">Veazy</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums">22 s</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <p style="margin: 0; padding: 0 24px 28px; font-size: 12px; line-height: 1.5; color: #A1A1A6; text-align: center">Stored only on this phone.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    var counts = [2, 1, 3, 0, 2, 4, 1];
    var bars = counts.map(function (c, i) {
      return { day: days[i], h: Math.max(4, c * 22), color: i === 5 ? '#FF7A1A' : '#3A3A3F' };
    });
    return { bars: bars };
  }
}
</script>
</body>
</html>
