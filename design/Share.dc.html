<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln – share a setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes kilnSheet{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
.kiln-sheet{animation:kilnSheet .42s cubic-bezier(.2,.9,.3,1) both}
.kiln-press{transition:transform .1s,background .2s,color .2s}
.kiln-press:active{transform:scale(.97)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
    <dc-import name="Veazy" finish="blue" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0,0,0,.6)"></div>

  <div role="dialog" aria-label="Share setup" class="kiln-sheet" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 32px; border-radius: 28px 28px 0 0; background: #111118; border-top: 1px solid #1F2937; color: #F9FAFB; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #374151"></span>

    <div style="align-self: stretch; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px">Share your setup</span>
      <span style="font-size: 14px; color: #9CA3AF">Your friend scans this and applies it in one tap.</span>
    </div>

    <div style="align-self: stretch; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #1C1C26">
      <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: linear-gradient(135deg, #9CC4FF, #2F6BFF)"></span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 15px; font-weight: 600">Balanced · Veazy</span>
        <span style="font-size: 13px; color: #9CA3AF; font-variant-numeric: tabular-nums">180° · boost 195° · super 210°</span>
      </div>
    </div>

    <div style="padding: 16px; border-radius: 22px; background: #F9FAFB">
      <div role="img" aria-label="QR code for this setup" style="display: grid; grid-template-columns: repeat(25, 8px); grid-auto-rows: 8px; width: 200px; height: 200px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
          <span style="background: {{c}}"></span>
        </sc-for>
      </div>
    </div>

    <div style="align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button onClick="{{copy}}" class="kiln-press" style="height: 54px; border-radius: 16px; border: 1px solid #1F2937; background: #1C1C26; color: #F9FAFB; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
        {{copyLabel}}
      </button>
      <a href="Receive.dc.html" class="kiln-press" style="height: 54px; border-radius: 16px; background: #3D8BFF; color: #0B0B0C; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        Share…
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  componentWillUnmount() { clearTimeout(this.copyTimer); }
  qr() {
    if (this._qr) return this._qr;
    var n = 25, seed = 1809, cells = [];
    var rand = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var finder = function (r, c) {
      var origins = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (var i = 0; i < origins.length; i++) {
        var dr = r - origins[i][0], dc = c - origins[i][1];
        if (dr >= -1 && dr <= 7 && dc >= -1 && dc <= 7) {
          if (dr < 0 || dr > 6 || dc < 0 || dc > 6) return 0;
          var edge = dr === 0 || dr === 6 || dc === 0 || dc === 6;
          var core = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
          return edge || core ? 1 : 0;
        }
      }
      return -1;
    };
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var f = finder(r, c);
        var on = f === -1 ? (r === 6 || c === 6 ? (r + c) % 2 === 0 : rand() > 0.52) : f === 1;
        cells.push(on ? '#0A0A0F' : 'transparent');
      }
    }
    this._qr = cells;
    return cells;
  }
  renderVals() {
    var self = this;
    return {
      cells: this.qr(),
      copyLabel: this.state.copied ? 'Copied' : 'Copy link',
      copy: function () {
        clearTimeout(self.copyTimer);
        self.setState({ copied: true });
        self.copyTimer = setTimeout(function () { self.setState({ copied: false }); }, 1600);
      }
    };
  }
}
</script>
</body>
</html>
