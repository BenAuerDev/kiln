<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln – workflow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F5; color: #121212; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <a href="Main.dc.html" aria-label="Back to control" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #121212; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Workflow</span>
    <button aria-label="Edit workflow" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #121212; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </button>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.02em">Three-balloon session</span>
    <span style="font-size: 14px; color: #5C5C63">Volcano Hybrid · 6 steps · about 5 min</span>
  </div>

  <div style="margin: 20px 20px 0; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E2DE; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #C2410C">Step 2 of 6 · Air</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums">0:18</span>
    </div>
    <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #EEEEEA; overflow: hidden">
      <div style="width: 40%; height: 8px; border-radius: 4px; background: #FF7A1A"></div>
    </div>
  </div>

  <ol style="list-style: none; margin: 20px 0 0; padding: 0 20px; display: flex; flex-direction: column; gap: 0">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
      <li style="display: flex; gap: 14px; align-items: stretch">
        <div style="display: flex; flex-direction: column; align-items: center; width: 28px">
          <span style="width: 28px; height: 28px; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: {{s.dotBg}}; color: {{s.dotFg}}; border: 2px solid {{s.dotBorder}}">{{s.n}}</span>
          <span style="flex-grow: 1; width: 2px; min-height: 18px; background: {{s.line}}"></span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-grow: 1; padding: 2px 0 18px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600; color: {{s.fg}}">{{s.title}}</span>
            <span style="font-size: 13px; color: #5C5C63">{{s.sub}}</span>
          </div>
          <span style="font-size: 13px; font-weight: 600; color: {{s.tagFg}}">{{s.tag}}</span>
        </div>
      </li>
    </sc-for>
  </ol>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 20px 32px">
    <button style="height: 60px; border-radius: 18px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #121212; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Skip step</button>
    <button style="height: 60px; border-radius: 18px; border: none; background: #121212; color: #F7F7F5; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Stop</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { title: 'Heat to 175 °C', sub: 'Wait until ready, then buzz', kind: 'done' },
      { title: 'Air 45 s', sub: 'Fill balloon 1', kind: 'active' },
      { title: 'Heat to 185 °C', sub: 'Wait until ready, then buzz', kind: 'todo' },
      { title: 'Air 45 s', sub: 'Fill balloon 2', kind: 'todo' },
      { title: 'Heat to 195 °C', sub: 'Wait until ready, then buzz', kind: 'todo' },
      { title: 'Air 45 s', sub: 'Fill balloon 3, heater off after', kind: 'todo' }
    ];
    var steps = raw.map(function (r, i) {
      var done = r.kind === 'done', active = r.kind === 'active';
      return {
        n: done ? '✓' : String(i + 1),
        title: r.title,
        sub: r.sub,
        fg: r.kind === 'todo' ? '#5C5C63' : '#121212',
        dotBg: done ? '#121212' : (active ? '#FF7A1A' : '#FFFFFF'),
        dotFg: done ? '#F7F7F5' : (active ? '#111111' : '#5C5C63'),
        dotBorder: done ? '#121212' : (active ? '#FF7A1A' : '#D4D4CF'),
        line: i === raw.length - 1 ? 'transparent' : (done ? '#121212' : '#E2E2DE'),
        tag: done ? 'Done' : (active ? 'Now' : ''),
        tagFg: active ? '#C2410C' : '#5C5C63'
      };
    });
    return { steps: steps };
  }
}
</script>
</body>
</html>
