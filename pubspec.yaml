name: kiln
description: "Unofficial controller for Storz & Bickel vaporizers."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  signals_flutter: ^7.1.0
  get_it: ^9.3.0
  flutter_hooks: ^0.21.3+1
  go_router: ^18.1.4
  fpdart: ^1.2.0
  flutter_blue_plus: ^2.3.15
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  obers_ui:
    git: https://github.com/SimonErich/obers_ui.git
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/png/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icons/png/ios/ember/app_icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icons/png/android/ember/foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icons/png/android/monochrome.png"
